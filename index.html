<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Krokodille · Norsk</title>
<meta name="description" content="Gjett, forklar og tegn norske ord – et lagspill for å lære norsk.">
<meta property="og:title" content="Krokodille · Norsk">
<meta property="og:description" content="Gjett, forklar og tegn norske ord – et lagspill for å lære norsk.">
<meta property="og:image" content="https://zagagulena.github.io/krokodille/icon-512.png">
<meta name="theme-color" content="#0b0c11">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* ================= ТЕМЫ ================= */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
body[data-theme=glass]{--bg:#0b0c11;--fg:#f4f6ff;--fg2:rgba(228,232,245,.7);--card:transparent;--ink:#f4f6ff;--mute:rgba(228,232,245,.62);--field:rgba(255,255,255,.07);--fieldD:transparent;
  --holo:linear-gradient(90deg,#ff5fb0,#b06bff,#4f8cff,#3fe0d0,#7dff7a,#ffe14f,#ff9a3d,#ff4f6a,#ff5fb0);
  --pastel:linear-gradient(90deg,#ff9ad5,#c9a0ff,#8fd3ff,#9dffcf,#ffe08a,#ff9a9a,#ff9ad5);
  --a:radial-gradient(120% 90% at 25% 0%,rgba(255,255,255,.3),transparent 46%),linear-gradient(135deg,#2b5cff,#3a1c9c 55%,#0b6a8a);--aD:transparent;
  --b:radial-gradient(120% 90% at 25% 0%,rgba(255,255,255,.3),transparent 46%),linear-gradient(135deg,#ff3d5a,#a01c6a 55%,#c2531a);--bD:transparent;
  --go:#e9ecf5;--goD:transparent;--goInk:#fff;--hi:linear-gradient(180deg,#fff,#d5dae6 40%,#8e96a8 54%,#eef0f7 70%,#b9c0cf);--hiD:transparent;--hiInk:#0a0a10;
  --btn:rgba(255,255,255,.07);--btnInk:#f4f6ff;--btnD:transparent;--glass:rgba(255,255,255,.06);--track:rgba(255,255,255,.08);--tbar:var(--holo);
  --r:30px;--bY:0px;--cardSh:none;--veil:rgba(6,7,12,.62);--pop:#fff;--popSh:none;--ls:-.01em;
  --chrome:linear-gradient(100deg,#aab3c8 0%,#ffffff 18%,#8a93a6 36%,#f1f3fa 50%,#7d879c 64%,#ffffff 82%,#aab3c8 100%);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","SF Pro Display","Nunito","Helvetica Neue",system-ui,sans-serif}
body[data-theme=nordlys]{--bg:#1a1442;--fg:#fff;--fg2:rgba(255,255,255,.78);--card:#fff;--ink:#2b2350;--mute:#7b7399;--field:#f3f1fa;--fieldD:#ddd8ef;
  --a:#1e5bd8;--aD:#1442a3;--b:#e0244b;--bD:#a8163a;--go:#2de2a6;--goD:#17a679;--goInk:#0d3b2c;--hi:#ffd54a;--hiD:#d9a91c;--hiInk:#4a3600;
  --btn:#fff;--btnInk:#2b2350;--btnD:rgba(0,0,0,.25);--glass:rgba(255,255,255,.18);--track:#ece9f7;--tbar:linear-gradient(90deg,#ffd54a,#ff8a3d);
  --r:22px;--bY:6px;--cardSh:0 7px 0 rgba(0,0,0,.22),0 18px 40px rgba(0,0,0,.18);--veil:rgba(26,20,66,.9);--pop:#fff;--popSh:0 6px 0 #17a679,0 0 30px #2de2a6;--ls:0;
  --font:"Nunito","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif}
body[data-theme=neon]{--bg:#090916;--fg:#e8faff;--fg2:rgba(232,250,255,.72);--card:#12122b;--ink:#e8faff;--mute:#8f9ccf;--field:#0b0b1f;--fieldD:#2a2a5a;
  --a:#2f7bff;--aD:#1b3f99;--b:#ff3b6b;--bD:#9c1f3f;--go:#00f0ff;--goD:#008c99;--goInk:#00222a;--hi:#ff2bd6;--hiD:#a3148a;--hiInk:#fff;
  --btn:#1c1c40;--btnInk:#e8faff;--btnD:#000;--glass:rgba(0,240,255,.12);--track:#1c1c40;--tbar:linear-gradient(90deg,#00f0ff,#ff2bd6);
  --r:10px;--bY:5px;--cardSh:0 0 0 2px #00f0ff66,0 0 26px #00f0ff33;--veil:rgba(9,9,22,.86);--pop:#00f0ff;--popSh:0 0 12px #00f0ff,0 0 40px #ff2bd6;--ls:.04em;
  --font:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace}
body[data-theme=hygge]{--bg:#f4eadb;--fg:#3a2f25;--fg2:#7d6b58;--card:#fffaf1;--ink:#3a2f25;--mute:#8a7a66;--field:#f4ecdf;--fieldD:#e0d2bb;
  --a:#3d6b8e;--aD:#2b4d68;--b:#b5443d;--bD:#84302b;--go:#5c8a5a;--goD:#41663f;--goInk:#fff;--hi:#e9b44c;--hiD:#b98a2c;--hiInk:#3a2f25;
  --btn:#fffaf1;--btnInk:#3a2f25;--btnD:#dccdb4;--glass:rgba(58,47,37,.09);--track:#eadfcd;--tbar:linear-gradient(90deg,#e9b44c,#c8553d);
  --r:18px;--bY:4px;--cardSh:0 0 0 2px #e6d8c3,0 8px 24px rgba(90,70,40,.10);--veil:rgba(244,234,219,.92);--pop:#c8553d;--popSh:0 3px 0 #fff;--ls:0;
  --font:Georgia,"Iowan Old Style","Palatino Linotype",serif}
body[data-theme=fjord]{--bg:#cfe8f7;--fg:#12324a;--fg2:#3f6077;--card:rgba(255,255,255,.94);--ink:#12324a;--mute:#6b8597;--field:#eef5f9;--fieldD:#cfdde6;
  --a:#1d4ed8;--aD:#163aa3;--b:#dc2626;--bD:#a51c1c;--go:#0e9aa7;--goD:#0a6f79;--goInk:#fff;--hi:#ffb703;--hiD:#c98f00;--hiInk:#3d2c00;
  --btn:#fff;--btnInk:#12324a;--btnD:#c5d6e0;--glass:rgba(255,255,255,.6);--track:#e3eef4;--tbar:linear-gradient(90deg,#0e9aa7,#ffb703);
  --r:16px;--bY:3px;--cardSh:0 10px 30px rgba(18,50,74,.16);--veil:rgba(207,232,247,.93);--pop:#0e7c86;--popSh:0 3px 0 #fff;--ls:0;
  --font:"Avenir Next","Segoe UI","Helvetica Neue",system-ui,sans-serif}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#1a1442}
html,body{margin:0;min-height:100%}
body{color:var(--fg);font:700 16px/1.35 var(--font);letter-spacing:var(--ls);background:transparent;overflow-x:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}

/* ---------- фоны тем ---------- */
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg);pointer-events:none}
#bg div{position:absolute}
[data-theme=glass] #bg .l1{inset:-25%;background:radial-gradient(42% 44% at 14% 16%,#4b2a86 0,transparent 72%),radial-gradient(44% 48% at 90% 52%,#7a4416 0,transparent 72%),radial-gradient(48% 44% at 16% 90%,#12605e 0,transparent 72%),radial-gradient(38% 38% at 70% 6%,#1c3f8a 0,transparent 72%);opacity:.7;will-change:transform;animation:gdrift 26s ease-in-out infinite alternate}
[data-theme=glass] #bg .l2{inset:0;background:radial-gradient(60% 40% at 50% 45%,rgba(255,255,255,.035),transparent 70%)}
[data-theme=glass] #bg::after{content:"";position:absolute;inset:0;background:radial-gradient(130% 100% at 50% 40%,transparent 45%,rgba(0,0,0,.55))}
@keyframes gdrift{from{transform:rotate(0) scale(1)}to{transform:rotate(16deg) scale(1.14)}}
[data-theme=nordlys] #bg .l1{inset:-50vmax;background:conic-gradient(from 0deg at 50% 50%,#2de2a6,#3b82f6,#a855f7,#ec4899,#2de2a6);filter:blur(80px);opacity:.5;animation:rot 26s linear infinite}
[data-theme=nordlys] #bg .l2{inset:0;background-image:radial-gradient(2px 2px at 20% 30%,#fff8,transparent),radial-gradient(1.5px 1.5px at 70% 20%,#fff9,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#fff6,transparent),radial-gradient(2px 2px at 85% 60%,#fff7,transparent),radial-gradient(1px 1px at 10% 85%,#fff8,transparent),radial-gradient(1.5px 1.5px at 55% 45%,#fff5,transparent);animation:twk 4s ease-in-out infinite alternate}
[data-theme=neon] #bg .l1{left:-60%;right:-60%;bottom:0;height:52%;background-image:linear-gradient(#ff2bd688 2px,transparent 2px),linear-gradient(90deg,#ff2bd688 2px,transparent 2px);background-size:64px 64px;transform:perspective(380px) rotateX(64deg);transform-origin:50% 100%;animation:grid 1.4s linear infinite;-webkit-mask-image:linear-gradient(transparent,#000 70%);mask-image:linear-gradient(transparent,#000 70%)}
[data-theme=neon] #bg .l2{inset:0;background:radial-gradient(46% 30% at 50% 44%,#7b2bff66,transparent 72%),radial-gradient(18% 12% at 50% 47%,#ff2bd655,transparent 70%)}
[data-theme=hygge] #bg .l1{left:-10%;right:-10%;bottom:-30px;height:36vh;background:radial-gradient(60% 100% at 22% 100%,#cfdcc6 99.5%,transparent),radial-gradient(70% 100% at 80% 100%,#b4c9ac 99.5%,transparent)}
[data-theme=hygge] #bg .l2{inset:0;background:radial-gradient(circle at 88% 62%,#f2c96b 0 38px,#f2c96b44 39px 62px,transparent 63px),radial-gradient(#d9c9ad 1px,transparent 1.5px) 0 0/22px 22px}
[data-theme=fjord] #bg{background:linear-gradient(#bfe0f5 0%,#eef8fd 56%,#9fd0e4 56%,#6fb2cf 100%)}
[data-theme=fjord] #bg .l1{left:0;right:0;bottom:44%;height:30vh;background:#8fb1c7;clip-path:polygon(0 100%,0 60%,12% 28%,22% 56%,35% 8%,48% 52%,60% 22%,72% 60%,85% 18%,100% 55%,100% 100%)}
[data-theme=fjord] #bg .l2{left:0;right:0;bottom:44%;height:18vh;background:#4f7d99;clip-path:polygon(0 100%,0 70%,15% 40%,30% 82%,45% 30%,58% 78%,75% 38%,90% 80%,100% 50%,100% 100%)}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes twk{to{opacity:.4}}
@keyframes grid{to{background-position:0 64px}}

#app{max-width:560px;margin:0 auto;padding:16px 16px 40px;position:relative}
#app.wide{max-width:900px}

/* ---------- базовые элементы ---------- */
.card{background:var(--card);color:var(--ink);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--cardSh)}
.card.dim{background:var(--glass);color:var(--fg);box-shadow:none}
h1{font-weight:900;font-size:36px;margin:0;line-height:1.05}
h2{font-weight:900;font-size:19px;margin:0 0 12px}
.mute{color:var(--mute)}.small{font-size:13px}.center{text-align:center}
.row{display:flex;gap:10px;align-items:center}.grow{flex:1;min-width:0}
.hint{color:var(--fg2);font-size:13px;text-align:center;margin:12px 0 0}
button{font:inherit;font-weight:900;letter-spacing:inherit;border:0;border-radius:calc(var(--r) * .72);padding:13px 16px;cursor:pointer;color:var(--btnInk);background:var(--btn);
  box-shadow:0 var(--bY) 0 var(--btnD);transition:transform .08s,box-shadow .08s,filter .2s}
button:active{transform:translateY(calc(var(--bY) - 1px));box-shadow:0 1px 0 var(--btnD)}
button.go{background:var(--go);color:var(--goInk);box-shadow:0 var(--bY) 0 var(--goD)}
button.go:active{box-shadow:0 1px 0 var(--goD)}
button.hi{background:var(--hi);color:var(--hiInk);box-shadow:0 var(--bY) 0 var(--hiD)}
button.glass{background:var(--glass);color:var(--fg);box-shadow:none}
button.full{width:100%}button.big{font-size:20px;padding:17px}
button.sm{padding:8px 12px;font-size:14px}
button.off{opacity:.45}
input[type=text],select{font:inherit;font-weight:800;color:var(--ink);background:var(--field);border:0;border-radius:calc(var(--r) * .7);padding:13px 14px;width:100%;outline:none;box-shadow:inset 0 -3px 0 var(--fieldD)}
input[type=text]:focus,select:focus{box-shadow:inset 0 -3px 0 var(--go)}
label.l{display:block;color:var(--mute);font-size:13px;margin:14px 0 6px;font-weight:800}
label.l:first-of-type{margin-top:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;min-height:38px}
.snd{display:flex;gap:6px}

/* ---------- меню ---------- */
.logo{text-align:center;margin:6px 0 18px}
.logo .croc{font-size:84px;display:inline-block;animation:croc 2.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes croc{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) translateY(-8px)}}
.logo h1 span{color:var(--go)}
.logo .sub{color:var(--fg2);margin-top:4px}
.nm{text-align:center;font-size:18px!important;color:#fff!important;text-transform:uppercase}
.nm.a{background:var(--a)!important;box-shadow:inset 0 -4px 0 var(--aD)!important}
.nm.b{background:var(--b)!important;box-shadow:inset 0 -4px 0 var(--bD)!important}
.vs{color:var(--mute);font-weight:900}
.tile{flex:1;min-width:0;display:flex}.tile .nm{flex:1;min-width:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;padding:10px 6px;font-size:14px;background:var(--field);color:var(--ink);box-shadow:0 3px 0 var(--fieldD);white-space:nowrap}
.seg button.on{background:var(--go);color:var(--goInk);box-shadow:0 3px 0 var(--goD)}
.chk{display:flex;align-items:center;gap:10px;margin-top:16px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--go)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;margin-bottom:6px}
.themes button{padding:0;overflow:hidden;height:86px;position:relative;box-shadow:0 3px 0 var(--fieldD);border-radius:14px;outline:3px solid transparent;outline-offset:2px}
.themes button.on{outline-color:var(--go)}
.themes .pv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:900 13px system-ui,sans-serif}
.themes .pv i{display:block;width:44px;height:26px;border-radius:7px}
.themes .pv u{display:flex;gap:4px;text-decoration:none}.themes .pv u b{width:10px;height:10px;border-radius:50%}
details.rules summary{cursor:pointer;font-weight:900}
details.rules ol{margin:10px 0 0;padding-left:20px;color:var(--fg2);font-size:14px}
details.rules li{margin-bottom:6px}
.hist{font-size:14px;color:var(--fg2)}
.hist div{display:flex;justify-content:space-between;padding:4px 0}

/* ---------- счёт / готовность ---------- */
.score{display:flex;gap:10px;margin-bottom:14px}
.score .s{flex:1;border-radius:calc(var(--r) * .8);padding:8px;text-align:center;font-weight:900;font-size:26px;color:#fff;min-width:0;opacity:.6;transition:.3s}
.score .s.act{opacity:1;transform:scale(1.03)}
.score .s small{display:block;font-size:12px;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s.t0{background:var(--a);box-shadow:0 var(--bY) 0 var(--aD)}.s.t1{background:var(--b);box-shadow:0 var(--bY) 0 var(--bD)}
.teamname{display:inline-block;color:#fff;font-size:34px;font-weight:900;padding:6px 22px;border-radius:999px;margin:8px 0;text-transform:uppercase;animation:enter .6s cubic-bezier(.3,1.6,.5,1) both;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.teamname.t0{background:var(--a);box-shadow:0 var(--bY) 0 var(--aD)}.teamname.t1{background:var(--b);box-shadow:0 var(--bY) 0 var(--bD)}
.steps{text-align:left;margin:14px auto;padding:0;list-style:none;max-width:400px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--hi);color:var(--hiInk);display:flex;align-items:center;justify-content:center;font-size:14px;font-family:system-ui,sans-serif}
.pill{display:inline-block;background:var(--field);border-radius:999px;padding:6px 14px}

/* ---------- раунд ---------- */
.who{color:#fff;border-radius:999px;padding:6px 14px;font-size:14px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who.t0{background:var(--a)}.who.t1{background:var(--b)}
.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.hudbox{background:var(--glass);border-radius:calc(var(--r) * .7);padding:6px 8px;text-align:center}
.hudbox small{display:block;font-size:11px;letter-spacing:1px;color:var(--fg2)}
.hudbox b{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;display:inline-block}
.hudbox.time.hurry b{color:var(--b);animation:bump .5s infinite}
[data-theme=nordlys] .hudbox.time.hurry b,[data-theme=neon] .hudbox.time.hurry b{color:#ff6b88}
.bump{animation:bump .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{40%{transform:scale(1.25)}}
.stage{background:var(--card);color:var(--ink);border-radius:calc(var(--r) * 1.25);padding:16px 16px 14px;text-align:center;box-shadow:var(--cardSh);margin-bottom:14px;position:relative;overflow:hidden}
.lvl{position:absolute;top:12px;right:14px;display:flex;gap:4px}
.lvl i{width:8px;height:8px;border-radius:50%;background:var(--track)}.lvl i.on{background:var(--hi)}
.picbox{height:clamp(190px,40vh,380px);display:flex;align-items:center;justify-content:center;position:relative;transition:filter .2s}
.paused .picbox{filter:blur(28px)}
.enter{display:inline-block;animation:enter .55s cubic-bezier(.25,1.6,.45,1) both}
@keyframes enter{0%{transform:scale(0) rotate(-25deg);opacity:0}100%{transform:scale(1) rotate(0)}}
.emo{display:inline-block;font-size:clamp(118px,29vh,270px);line-height:1;filter:drop-shadow(0 10px 12px rgba(20,15,50,.22));will-change:transform;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.shadow{position:absolute;bottom:8px;left:50%;width:120px;height:14px;margin-left:-60px;border-radius:50%;background:rgba(43,35,80,.13);animation:shd 1.4s ease-in-out infinite}
[data-theme=neon] .shadow{background:#00f0ff33}
@keyframes shd{50%{transform:scaleX(.8);opacity:.6}}
.wordline{min-height:0;font-size:clamp(24px,5vh,40px);font-weight:900}
.wordline:not(:empty){margin:2px 0 8px}
.art{color:var(--mute);font-size:.68em;margin-right:.25em}
.timer{height:18px;border-radius:12px;background:var(--track);overflow:hidden;margin-top:8px}
.tclip{display:block;height:100%;border-radius:999px;overflow:hidden;transform:translateZ(0)}
.timer i{display:block;height:100%;width:100%;border-radius:999px;background:var(--tbar);will-change:transform}
.timer.hurry i{background:linear-gradient(90deg,#ff8a3d,var(--b));animation:hb .5s ease-in-out infinite}
@keyframes hb{50%{filter:brightness(1.35)}}
.ctrl{display:grid;grid-template-columns:1fr 2fr;gap:12px}
.ctrl button{font-size:clamp(17px,2.6vh,24px);padding:clamp(16px,2.6vh,24px) 10px}
.ctrl .skip{background:var(--glass);color:var(--fg);box-shadow:none}
.pauseov{position:fixed;inset:0;z-index:6;display:none;align-items:center;justify-content:center;background:var(--veil);cursor:pointer;text-align:center;color:var(--fg)}
.paused .pauseov{display:flex}
.pauseov b{display:block;font-size:44px}.pauseov span{color:var(--fg2)}
.pauseov .ic{font-size:64px;line-height:1.2}
.pi{display:inline-block;width:.62em;height:.8em;border-left:.22em solid currentColor;border-right:.22em solid currentColor;vertical-align:-.08em;box-sizing:border-box}

/* ---------- отсчёт ---------- */
.cd{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:5}
.cd .n{position:absolute;font-size:150px;font-weight:900;color:var(--fg);opacity:0;animation:cdn .65s cubic-bezier(.3,1.6,.5,1) both}
.cd .n.kj{font-size:84px;color:var(--go);animation-duration:.9s}
[data-theme=hygge] .cd .n.kj,[data-theme=fjord] .cd .n.kj{color:var(--pop)}
@keyframes cdn{0%{transform:scale(2.4);opacity:0}25%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.6);opacity:0}}
.cd .ring{width:220px;height:220px;border-radius:50%;border:10px solid var(--glass);border-top-color:var(--go);animation:spin .65s linear infinite}
.cd .lbl{position:absolute;top:20%;font-size:22px;letter-spacing:2px;text-transform:uppercase}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- анимация верного ответа ---------- */
.burst{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center}
.burst .veil{position:absolute;inset:0;background:var(--veil);animation:vin .18s ease-out both,bout .25s 1.35s ease-in forwards}
.burst .glow{position:absolute;left:50%;top:50%;width:140vmax;height:140vmax;margin:-70vmax;border-radius:50%;background:radial-gradient(circle,var(--go) 0,transparent 55%);opacity:.35;animation:gl .9s ease-out both,bout .25s 1.35s ease-in forwards}

.burst .bword{font-size:clamp(30px,6vh,54px);font-weight:900;color:var(--fg);margin:10px 0 12px}

.burst .bword .l{display:inline-block;animation:flipIn .45s cubic-bezier(.3,1.5,.5,1) both}

.burst .pts{display:inline-block;background:var(--hi);color:var(--hiInk);padding:6px 20px;border-radius:999px;font-size:clamp(24px,4.4vh,38px);font-weight:900;box-shadow:0 5px 0 var(--hiD);animation:enter .5s .25s cubic-bezier(.3,1.7,.5,1) both}

@keyframes vin{from{opacity:0}}
@keyframes gl{from{transform:scale(.2);opacity:.7}}
@keyframes bout{to{opacity:0}}
@keyframes bigIn{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.pt{position:absolute;left:50%;top:50%;font-size:30px;animation:pt 1.1s cubic-bezier(.2,.7,.3,1) both}
@keyframes pt{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(var(--rot));opacity:0}}
.timeup{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:var(--veil);animation:vin .2s both}
.timeup b{font-size:clamp(44px,9vw,92px);font-weight:900;color:var(--fg);text-align:center;animation:tu .7s cubic-bezier(.3,1.6,.5,1) both,shakeX .5s .7s 2}
.timeup b span{display:block;font-size:.9em}
@keyframes tu{from{transform:scale(3);opacity:0}}
@keyframes shakeX{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.skipout{animation:skipout .22s ease-in both}

/* ---------- итоги ---------- */
.bigscore{font-size:72px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}

.stats3 div{background:var(--field);border-radius:14px;padding:10px 2px;font-weight:900;font-size:22px}
.stats3 small{display:block;color:var(--mute);font-size:11px}
.list .it{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:2px solid var(--field)}
.list .it:last-child{border:0}
.list .it .e{font-size:28px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.list .it .r{font-size:13px;white-space:nowrap;text-align:right}
.list .it .r.ok{color:var(--goD)}[data-theme=neon] .list .it .r.ok{color:var(--go)}
.list .it.no b{opacity:.55}
.trophy{font-size:96px;text-align:center;animation:trophy 1.1s cubic-bezier(.3,1.5,.5,1) both,tglow 2s 1.1s ease-in-out infinite;filter:drop-shadow(0 0 30px #ffd54a99)}
@keyframes trophy{0%{transform:translateY(-120vh) rotate(-30deg)}60%{transform:translateY(0) rotate(8deg)}100%{transform:rotate(0)}}
@keyframes tglow{50%{transform:scale(1.07) rotate(-4deg)}}
.winner{font-size:clamp(28px,6vw,44px);font-weight:900;text-align:center;margin:4px 0 16px;animation:enter .7s .5s cubic-bezier(.3,1.6,.5,1) both;text-transform:uppercase}
.winner small{display:block;font-size:14px;color:var(--fg2);text-transform:none}
.final{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.final .f{border-radius:var(--r);padding:14px 10px;color:#fff;text-align:center;min-width:0;position:relative}
.final .f.t0{background:var(--a);box-shadow:0 var(--bY) 0 var(--aD)}.final .f.t1{background:var(--b);box-shadow:0 var(--bY) 0 var(--bD)}
.final .f.win{animation:winp 1.2s 1.6s ease-in-out infinite}
@keyframes winp{50%{transform:scale(1.04)}}
.final .f .n{font-size:15px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.final .f .p{font-size:52px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.final .f .d{font-size:12px;opacity:.9}
.final .f .cr{position:absolute;top:-30px;left:50%;margin-left:-16px;font-size:32px;animation:enter .6s 1.5s both}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.cols{grid-template-columns:1fr}}
.cols h2{display:flex;align-items:center;gap:8px}.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.dot.t0{background:var(--a)}.dot.t1{background:var(--b)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:7}
.toast{width:max-content;max-width:min(90vw,440px);position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);opacity:0;transition:.3s cubic-bezier(.3,1.5,.5,1);padding:12px 18px;border-radius:16px;background:var(--card);color:var(--ink);z-index:9;font-weight:900;max-width:90vw;text-align:center;box-shadow:var(--cardSh);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ================= АНИМАЦИИ КАРТИНОК ================= */
.a-hop{animation:hop 1.1s cubic-bezier(.3,0,.5,1) infinite;transform-origin:50% 100%}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.08,.92)}15%{transform:translateY(0) scale(.94,1.06)}50%{transform:translateY(-26px) scale(1)}85%{transform:translateY(0) scale(1.04,.96)}}
.a-fly{animation:fly 2.6s ease-in-out infinite}
@keyframes fly{0%,100%{transform:translate(-22px,4px) rotate(-8deg)}25%{transform:translate(0,-14px) rotate(4deg)}50%{transform:translate(22px,2px) rotate(8deg)}75%{transform:translate(0,-10px) rotate(-4deg)}}
.a-flutter{animation:flutter .5s ease-in-out infinite,drift8 3s ease-in-out infinite}
@keyframes flutter{50%{transform:scaleX(.82)}}
@keyframes drift8{0%,100%{translate:-18px 0}25%{translate:0 -12px}50%{translate:18px 0}75%{translate:0 10px}}
.a-swim{animation:swim 2.4s ease-in-out infinite}
@keyframes swim{0%,100%{transform:translate(-16px,0) rotate(-6deg)}50%{transform:translate(16px,-8px) rotate(6deg)}}
.a-slither{animation:slither 1.4s ease-in-out infinite}
@keyframes slither{0%,100%{transform:skewX(-10deg) translateX(-8px)}50%{transform:skewX(10deg) translateX(8px)}}
.a-dangle{animation:dangle 2.2s ease-in-out infinite;transform-origin:50% -60%}
@keyframes dangle{0%,100%{transform:translateY(-10px) rotate(-6deg)}50%{transform:translateY(10px) rotate(6deg)}}
.a-crawl{animation:crawl 3s ease-in-out infinite}
@keyframes crawl{0%,100%{transform:translateX(-14px)}50%{transform:translateX(14px)}}
.a-flyby{animation:flyby 3s ease-in-out infinite}
@keyframes flyby{0%{transform:translate(-30px,10px) rotate(-10deg)}50%{transform:translate(30px,-14px) rotate(-18deg)}100%{transform:translate(-30px,10px) rotate(-10deg)}}
.a-launch{animation:launch 1.8s ease-in-out infinite}
@keyframes launch{0%,100%{transform:translate(0,6px)}10%,30%{transform:translate(-2px,4px)}20%,40%{transform:translate(2px,6px)}70%{transform:translate(0,-26px)}}
.a-hover{animation:hover 1.6s ease-in-out infinite}
@keyframes hover{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
.a-sun{animation:sunr 10s linear infinite,glow 2s ease-in-out infinite}
@keyframes sunr{to{rotate:360deg}}
.a-glow{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 26px #ffd54a) brightness(1.15);transform:scale(1.06)}}
.a-rock{animation:rock 2.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes rock{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
.a-twinkle{animation:twinkle 1.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.15) rotate(18deg);filter:drop-shadow(0 0 22px #ffd54a)}}
.a-drift{animation:driftC 3.2s ease-in-out infinite}
@keyframes driftC{0%,100%{transform:translateX(-18px)}50%{transform:translateX(18px) translateY(-6px)}}
.a-snow{animation:snow 6s linear infinite,floatY 2.4s ease-in-out infinite}
@keyframes snow{to{rotate:360deg}}
@keyframes floatY{50%{transform:translateY(-12px)}}
.a-flash{animation:flashE 2s infinite}
@keyframes flashE{0%,40%,100%{filter:none;transform:scale(1)}42%,48%{filter:brightness(2.2) drop-shadow(0 0 30px #fff7a8);transform:scale(1.12)}45%{filter:none}}
.a-shine{animation:shine 2.4s ease-in-out infinite}
@keyframes shine{50%{filter:saturate(1.6) brightness(1.15) drop-shadow(0 0 18px #fff);transform:scale(1.06)}}
.a-flicker{animation:flicker 1.2s infinite;transform-origin:50% 100%}
@keyframes flicker{0%,100%{transform:scale(1,1) skewX(0)}25%{transform:scale(1.04,.96) skewX(3deg)}50%{transform:scale(.97,1.06) skewX(-3deg);filter:brightness(1.2) drop-shadow(0 0 20px #ff8a3d)}75%{transform:scale(1.02,.98) skewX(2deg)}}
.a-wave{animation:waveE 2s ease-in-out infinite}
@keyframes waveE{0%,100%{transform:translateX(-10px) rotate(-6deg)}50%{transform:translateX(10px) rotate(6deg) translateY(-8px)}}
.a-sway{animation:sway 2.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.a-leaf{animation:leaf 3s ease-in-out infinite}
@keyframes leaf{0%,100%{transform:translate(-16px,-8px) rotate(-25deg)}50%{transform:translate(16px,8px) rotate(25deg)}}
.a-spin{animation:snow 8s linear infinite}
.a-ring{animation:ringE 1.8s infinite}
@keyframes ringE{0%,40%,100%{transform:rotate(0)}5%,15%,25%,35%{transform:rotate(-14deg)}10%,20%,30%{transform:rotate(14deg)}}
.a-beat{animation:beat 1s infinite}
@keyframes beat{0%,40%,100%{transform:scale(1)}15%{transform:scale(1.2)}25%{transform:scale(1.05)}32%{transform:scale(1.15)}}
.a-blink{animation:blink 3s infinite}
@keyframes blink{0%,44%,52%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
.a-waveHand{animation:waveH 1.4s ease-in-out infinite;transform-origin:70% 90%}
@keyframes waveH{0%,100%{transform:rotate(0)}20%,60%{transform:rotate(-18deg)}40%,80%{transform:rotate(14deg)}}
.a-shakeG{animation:shakeG 2s infinite}
@keyframes shakeG{0%,60%,100%{transform:rotate(0) scale(1)}65%,75%,85%{transform:rotate(-10deg) scale(1.05)}70%,80%,90%{transform:rotate(10deg) scale(1.05)}}
.a-squash{animation:squash 1.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes squash{0%,100%{transform:scale(1,1)}50%{transform:scale(1.12,.88)}}
.a-erupt{animation:erupt 2s infinite;transform-origin:50% 100%}
@keyframes erupt{0%,70%,100%{transform:scale(1)}75%{transform:scale(1.1,.9)}82%{transform:scale(.95,1.12) translateY(-6px);filter:drop-shadow(0 -10px 20px #ff5a1f)}}
.a-jelly{animation:jelly 1.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes jelly{0%,100%{transform:scale(1,1)}20%{transform:scale(1.12,.88)}40%{transform:scale(.9,1.1)}60%{transform:scale(1.05,.95)}80%{transform:scale(.98,1.02)}}
.a-swing{animation:swingT 2.2s ease-in-out infinite;transform-origin:50% -10%}
@keyframes swingT{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
.a-tilt{animation:tilt 2.4s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(6deg) translateY(-8px)}}
.a-drive{animation:drive 2.2s ease-in-out infinite}
@keyframes drive{0%{transform:translateX(-26px)}45%{transform:translateX(26px)}50%{transform:translateX(26px) scaleX(-1)}95%{transform:translateX(-26px) scaleX(-1)}100%{transform:translateX(-26px)}}
.a-bump{animation:bumpy .5s ease-in-out infinite,crawl 3s ease-in-out infinite}
@keyframes bumpy{50%{translate:0 -4px}}
.a-float{animation:floatY 2.6s ease-in-out infinite}
.a-pulse{animation:pulseE 1.6s ease-in-out infinite}
@keyframes pulseE{50%{transform:scale(1.1)}}
.a-hug{animation:hug 1.8s ease-in-out infinite}
@keyframes hug{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.12,.94) rotate(-5deg)}60%{transform:scale(.96,1.06) rotate(5deg)}}
/* радость после верного ответа */
.happy{animation:happy .9s cubic-bezier(.3,1.5,.5,1) both !important}
@keyframes happy{0%{transform:scale(1)}30%{transform:translateY(-40px) scale(1.25) rotate(-12deg)}60%{transform:translateY(0) scale(.95) rotate(360deg)}100%{transform:scale(1.05) rotate(360deg)}}

const Snd={
  ac:null,loop:null,accel:0,
  init(){

    let ac; try{ac=this.ac=new AC();}catch(e){return false;}

    this.an=ac.createAnalyser(); this.an.fftSize=2048; comp.connect(this.an);

    const len=Math.floor(ac.sampleRate*(Perf.lite?1.2:2)), ir=ac.createBuffer(2,len,ac.sampleRate);
    for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2);}

    this.music=ac.createGain(); this.music.gain.value=this.mLevel(); this.music.connect(this.out);
    this.fx=ac.createGain(); this.fx.gain.value=cfg.fx?.9:0; this.fx.connect(this.out);
    return true;

  send(node,bus,wet=.3){ node.connect(bus); if(wet){const s=this.ac.createGain();s.gain.value=wet;node.connect(s);s.connect(this.rev);} },
  /* --- инструменты --- */

      if(self.loop!==L) return;
      if(!L.paused){
        const dt=60/(T.bpm*(kind==='round'?1+self.accel:1))/4;
        let guard=0;
        if(L.next<self.ac.currentTime-.3) L.next=self.ac.currentTime+.05;   // вкладка была в фоне

    };

/* ================== КОЛОДЫ: разные картинки, одинаковая сложность ==================
   Слова собираются в пары одной сложности (по возможности и одной темы).
   На каждом месте в очереди одна команда получает первое слово пары, другая — второе. */
function buildDecks(){
  let ws=WORDS.filter(w=>(cfg.topic==='all'||w.t===cfg.topic)&&DIFF[cfg.diff].includes(w.d));
  const mk=list=>{
    const seen=new Set(cfg.seen), groups={}, rest={1:[],2:[],3:[]}, pairs=[];
    shuffle([...list]).forEach(w=>(groups[w.d+'|'+w.t]=groups[w.d+'|'+w.t]||[]).push(w));
    Object.values(groups).forEach(g=>{ g.sort((a,b)=>seen.has(a.no)-seen.has(b.no)); while(g.length>=2) pairs.push([g.shift(),g.shift()]); if(g.length) rest[g[0].d].push(g[0]); });
    Object.values(rest).forEach(g=>{ while(g.length>=2) pairs.push([g.shift(),g.shift()]); });
    const old=p=>seen.has(p[0].no)||seen.has(p[1].no);
    return [...shuffle(pairs.filter(p=>!old(p))),...shuffle(pairs.filter(old))];
  };
  const main=mk(ws), per=15, n=Math.floor(main.length/cfg.rounds);
  let extra=[], note='';
  if(n<per){ extra=mk(WORDS.filter(w=>!ws.includes(w)&&DIFF[cfg.diff].includes(w.d))); if(extra.length) note='Få ord i dette temaet – fyller på med andre temaer.'; }
  const decks=[], target=Math.min(per,Math.floor((main.length+extra.length)/cfg.rounds));
  for(let r=0;r<cfg.rounds;r++){
    const chunk=main.slice(r*n,(r+1)*n), d=[[],[]];
    while(chunk.length<target&&extra.length) chunk.push(extra.shift());
    chunk.forEach(p=>{const f=Math.random()<.5?0:1; d[0].push(p[f]); d[1].push(p[1-f]);});
    decks.push(d);
  }
  return {decks,note};
}

/* ================== ПУЛЬТ: связь между экраном и телефонами ==================
   Работает через «комнату» платформы: все, у кого страница открыта сейчас.
   Экран публикует своё состояние в presence (его сразу получает и тот, кто подключился позже).
   Телефон шлёт команды (RIKTIG, HOPP OVER…) и рисунок: законченные линии — сообщениями,
   текущую линию и список линий — в presence. Сообщения могут теряться, поэтому экран сверяет
   список линий и при пропуске просит прислать недостающее. */
const B64='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_', QS=2400;

  s+=B64[a>>6]+B64[a&63]+B64[b>>6]+B64[b&63]; } return s; };
const decP=s=>{ const o=[]; for(let i=0;i+3<s.length;i+=4){ const a=(B64.indexOf(s[i])<<6)|B64.indexOf(s[i+1]), b=(B64.indexOf(s[i+2])<<6)|B64.indexOf(s[i+3]); o.push([a/QS,b/QS]); } return o; };
const encStroke=st=>{ let p=st.p; if(p.length>880){ const k=Math.ceil(p.length/880); p=p.filter((_,i)=>i%k===0||i===st.p.length-1); }
  return {id:st.id,ci:st.ci,s:+st.s.toFixed(4),e:st.e?1:0,p:encP(p)}; };
function decStroke(d){                      // всё, что пришло с другого устройства, проверяем
  if(!d||typeof d!=='object') return null;
  const id=d.id, ci=d.ci, sz=d.s, p=d.p;
  if(!Number.isInteger(id)||!Number.isInteger(ci)||ci<0||ci>5||typeof sz!=='number'||!(sz>0.001&&sz<0.2)) return null;
  if(typeof p!=='string'||p.length>4000||!/^[A-Za-z0-9_-]*$/.test(p)) return null;
  const pts=decP(p); if(!pts.length) return null;
  return {id,ci,s:sz,e:!!d.e,p:pts};

  if(st.mode==='draw') return head+stat+`<div class="rstrip ${R.hide?'hidew':''}"><span class="rsecret">${wordTxt}</span><span class="grow"></span>

let screen='menu', game=null, play=null;
const turn=()=>game.turns[game.ti];
const curItem=()=>{const t=turn();return t.items[t.items.length-1];};

function newGame(){
  cfg.names=cfg.names.map((n,i)=>(String(n||'').trim().slice(0,14)||DEF.names[i]));
  if(cfg.names[0].toLowerCase()===cfg.names[1].toLowerCase()) cfg.names[1]+=' 2';
  save(); gen++;
  const {decks,note}=buildDecks();
  const turns=[]; for(let r=0;r<cfg.rounds;r++)(r%2?[1,0]:[0,1]).forEach(t=>turns.push({team:t,round:r,items:[],score:0}));
  game={decks,turns,ti:0,scores:[0,0],mode:cfg.mode}; play=null;
  preload(decks.flat(2).map(w=>w.e).concat('🏆','🤝','👑','⏰'));
  screen='ready'; render(); if(note) toast(note);
}
function startTurn(){
  screen='countdown'; render(); Snd.stop(.3);
  [0,1,2].forEach(i=>later(()=>Snd.sfx('count'),i*650)); later(()=>Snd.sfx('go'),1950);
  later(beginPlay,CD_MS);
}
function beginPlay(){
  const total=cfg.secs*1000;
  play={total,left:total,elapsed:0,idx:-1,picStart:0,anim:false,paused:false,over:false,last:performance.now(),lastSec:null};
  screen='play'; render(); nextPic(true);
  Snd.accel=0; if(cfg.music) Snd.play('round');
}
function nextPic(first){
  const t=turn(), deck=game.decks[t.round][t.team];
  play.idx++; const w=deck[play.idx%deck.length];
  t.items.push({w,res:null,pts:0,t:0}); play.picStart=play.elapsed; RC.clearCard();
  if(!cfg.seen.includes(w.no)) cfg.seen.push(w.no);
  drawPic(); RC.push();
}
function drawPic(){
  const w=curItem().w;
  const lv=$('#lvl'); if(lv) lv.innerHTML=[1,2,3].map(i=>`<i class="${i<=w.d?'on':''}"></i>`).join('');
  if(isDraw()){
    const ov=$('#peekov'); if(ov) ov.innerHTML=`${em(w.e,'pk')}<b>${wordHtml(w)}</b><small>Bare tegneren ser dette</small>`;
    const pk=$('#peek'); if(pk) pk.classList.add('new');
    const cb=$('.cvbox'); if(cb) cb.classList.remove('wipe');
    const h=$('#cvhint'); if(h) h.classList.remove('off');
    Draw.reset(); return;
  }
  const p=$('#pic'); if(!p) return;
  p.innerHTML=`<span class="enter">${em(w.e,'emo '+animFor(w))}</span><div class="shadow"></div>`;
  $('#wl').innerHTML=cfg.showWord?wordHtml(w):'';
  $('#lvl').innerHTML=[1,2,3].map(i=>`<i class="${i<=w.d?'on':''}"></i>`).join('');
}
const wordHtml=w=>`${artOf(w)?`<span class="art">${artOf(w)}</span>`:''}${esc(w.no)}`;
// очки: 100 за ответ + до 100 за скорость.
// Объяснение: полный бонус до 2 с, ноль после 15 с. Рисование дольше: полный бонус до 5 с, ноль после 40 с.
const pointsFor=ms=>{ const [a,b]=isDraw()?[5000,40000]:[2000,15000]; return 100+Math.round(100*Math.min(1,Math.max(0,1-(ms-a)/(b-a)))); };

function correct(){
  if(screen!=='play'||!play||play.anim||play.paused||play.over) return;
  const t=turn(), it=curItem(), ms=play.elapsed-play.picStart, pts=pointsFor(ms);
  it.res='ok'; it.pts=pts; it.t=ms; t.score+=pts;
  if(isDraw()){ it.d=Draw.snap(); peek(false); }
  play.anim=true;                        // время стоит, пока идёт анимация
  Snd.pause(); Snd.sfx('correct'); RC.push();
  showCorrect(it.w,pts,it.d);
  const sc=$('#sc'), ok=$('#okc');
  if(sc){ sc.textContent=t.score; bump(sc); } if(ok){ ok.textContent=t.items.filter(x=>x.res==='ok').length; bump(ok); }
  later(()=>{ play.anim=false; play.last=performance.now(); nextPic(); Snd.resume(); },ANIM_MS);
}
function skip(){
  if(screen!=='play'||!play||play.anim||play.paused||play.over) return;
  const it=curItem(); it.res='skip'; it.t=play.elapsed-play.picStart;
  Snd.sfx('skip');
  const e=$('#pic .enter'); if(e){ e.className='skipout'; }
  if(isDraw()){ it.d=Draw.snap(); peek(false); const cb=$('.cvbox'); if(cb) cb.classList.add('wipe'); }
  play.anim=true; later(()=>{ play.anim=false; play.last=performance.now(); nextPic(); },220);
}
function togglePause(){
  if(screen!=='play'||!play||play.anim||play.over) return;
  play.paused=!play.paused; play.last=performance.now();
  document.body.classList.toggle('paused',play.paused); if(play.paused) peek(false); RC.push();
  if(play.paused) Snd.pause(); else Snd.resume();
}
function toggleWord(){ if(isDraw()) return; cfg.showWord=!cfg.showWord; save(); if(screen==='play'&&play&&!play.over){ $('#wl').innerHTML=cfg.showWord?wordHtml(curItem().w):''; } }
function timeUp(){
  play.over=true; play.left=0; RC.push();
  const t=turn(), it=curItem(); if(it&&it.res===null){ it.res='miss'; it.t=play.elapsed-play.picStart; if(isDraw()) it.d=Draw.snap(); }
  peek(false);
  game.scores[t.team]+=t.score; save();
  Snd.stop(.1); Snd.sfx('timeup');
  const d=document.createElement('div'); d.className='timeup'; d.id='timeup'; d.innerHTML=`<b>${em('⏰','ti')}<span>TIDEN ER UTE!</span></b>`; document.body.appendChild(d);
  later(()=>{ d.remove(); screen='turnEnd'; render(); if(cfg.music) Snd.play('menu'); },1900);
}
function nextTurn(){
  game.ti++;
  if(game.ti>=game.turns.length){
    cfg.history.unshift({d:Date.now(),n:[...cfg.names],s:[...game.scores]}); cfg.history=cfg.history.slice(0,5);
    if(cfg.seen.length>WORDS.length*.75) cfg.seen=cfg.seen.slice(-Math.floor(WORDS.length*.25));
    save(); screen='results'; render();
    Snd.stop(.1); Snd.sfx('fanfare'); later(()=>{ if(screen==='results'&&cfg.music) Snd.play('party'); },3200);
  } else { screen='ready'; render(); }
}
let quitArmed=0;
function quit(){
  if(Date.now()-quitArmed>3000){ quitArmed=Date.now(); toast('Trykk en gang til for å avslutte spillet'); return; }
  toMenu();
}
function toMenu(){
  gen++; game=null; play=null; document.body.classList.remove('paused');
  const tu=$('#timeup'); if(tu) tu.remove();
  screen='menu'; render(); Snd.stop(.1); if(cfg.music) Snd.play('menu');
}

/* ================== ЭФФЕКТЫ ================== */
function bump(el){ el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
function showCorrect(w,pts,drawing){
  const d=document.createElement('div'); d.className='burst';
  const parts=['⭐','✨','🌟','💫','🎉','⭐','✨','💚'];
  const np=Perf.lite?8:20; let ps=''; for(let i=0;i<np;i++){ const a=Math.PI*2*i/np+Math.random()*.3, r=180+Math.random()*200;
    ps+=`<span class="pt" style="--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r}px;--rot:${Math.random()*360-180}deg;animation-delay:${Math.random()*.1}s">${parts[i%parts.length]}</span>`; }
  const letters=[...w.no].map((c,i)=>`<span class="l" style="animation-delay:${.12+i*.04}s;background-position:${(i+1)*11%100}% 0">${esc(c)}</span>`).join('');
  d.innerHTML=`<div class="veil"></div><div class="glow"></div>${ps}<div class="txt">${drawing?`<div class="cmp"><img class="dthumb" src="${drawing}" alt="Tegningen"><span class="arr">→</span>${em(w.e,'bemo happy')}</div>`:`<div>${em(w.e,'bemo happy')}</div>`}<b class="ttl">RIKTIG!</b>
    <div class="bword">${artOf(w)?`<span class="art">${artOf(w)}</span>`:''}${letters}</div><span class="pts">+${pts}</span><em class="frz"><span class="pi"></span> tiden står stille</em></div>`;
  document.body.appendChild(d); setTimeout(()=>d.remove(),ANIM_MS);
}
let confRAF=null;
function confetti(ms=5500){
  const c=$('#confetti'), x=c.getContext('2d'), dpr=Math.min(window.devicePixelRatio||1,Perf.lite?1.25:2);
  c.width=innerWidth*dpr; c.height=innerHeight*dpr; x.setTransform(dpr,0,0,dpr,0,0);
  const cs=getComputedStyle(document.body), cols=cfg.theme==='glass'?['#3d7bff','#ff8a3d','#ff4fb0','#ffffff','#c9cfdc','#8a5cff']:['--a','--b','--go','--hi'].map(v=>cs.getPropertyValue(v).trim()).concat('#ffffff','#a855f7');
  const P=[]; for(let i=0;i<(Perf.lite?80:200);i++) P.push({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.35,vx:(Math.random()-.5)*18,vy:-Math.random()*16-6,
    w:6+Math.random()*7,h:9+Math.random()*9,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[i%cols.length],sh:Math.random()<.3});
  const t0=performance.now(); cancelAnimationFrame(confRAF);
  (function fr(t){
    const el=t-t0; x.clearRect(0,0,innerWidth,innerHeight);
    P.forEach(p=>{ p.vy+=.35; p.vx*=.99; p.vy*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      if(el<ms*.6&&p.y>innerHeight+20){ p.y=-20; p.x=Math.random()*innerWidth; p.vy=Math.random()*3; }
      x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.globalAlpha=Math.max(0,1-Math.max(0,el-ms+900)/900); x.fillStyle=p.c;
      if(p.sh){x.beginPath();x.arc(0,0,p.w/2,0,7);x.fill();} else x.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*1.3))+2); x.restore(); });
    if(el<ms&&screen==='results') confRAF=requestAnimationFrame(fr); else x.clearRect(0,0,innerWidth,innerHeight);
  })(t0);
}
function countUp(el,to,dur=1300){
  const t0=performance.now();
  (function f(t){ const k=Math.min(1,(t-t0)/dur); el.textContent=Math.round(to*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(f); })(t0);
}

/* ================== ЖИВЫЕ СТЕКЛЯННЫЕ РАМКИ ==================
   Контур каждой панели — замкнутая кривая, которая всё время слегка «дышит», как жидкое стекло. */
const Liquid={
  frames:[], n:0, t0:performance.now(), last:0, io:null,
  attach(){
    if(this.io) this.io.disconnect(); if(this.ro) this.ro.disconnect();
    this.frames=[];
    if(cfg.theme!=='glass') return;
    this.io=('IntersectionObserver' in window)?new IntersectionObserver(es=>es.forEach(e=>{const f=this.frames.find(x=>x.el===e.target); if(f) f.vis=e.isIntersecting;}),{rootMargin:'60px'}):null;
    // размеры панелей сообщает браузер — не измеряем их на каждом кадре
    this.ro=('ResizeObserver' in window)?new ResizeObserver(es=>es.forEach(e=>{const f=this.frames.find(x=>x.el===e.target); if(f){ f.nw=e.target.offsetWidth; f.nh=e.target.offsetHeight; }})):null;
    document.querySelectorAll('#app .card:not(.bare), #app .stage, #app .hudbox').forEach(el=>{
      const id='lq'+(++this.n), ns='http://www.w3.org/2000/svg', svg=document.createElementNS(ns,'svg');
      svg.setAttribute('class','lqf'); svg.setAttribute('aria-hidden','true');
      svg.innerHTML=`<defs><path id="${id}"/></defs><use href="#${id}" class="fl"/><use href="#${id}" class="r1"/><use href="#${id}" class="r3"/><use href="#${id}" class="r2"/>`;
      el.prepend(svg);
      const f={el,path:svg.querySelector('path'),r2:svg.querySelector('.r2'),nw:el.offsetWidth,nh:el.offsetHeight,w:0,h:0,pts:null,vis:true,ph:Math.random()*6.28,amp:el.classList.contains('stage')?4.2:el.classList.contains('hudbox')?1.7:3.2};
      this.frames.push(f); if(this.io) this.io.observe(el); if(this.ro) this.ro.observe(el);
    });
    this.draw(performance.now(),true);
  },
  outline(w,h){                       // точки скруглённого прямоугольника с нормалями
    const P=10, r=Math.min(34,h/2-2,w/2-2), pts=[], step=20;
    const line=(x0,y0,x1,y1,nx,ny)=>{const L=Math.hypot(x1-x0,y1-y0),k=Math.max(1,Math.round(L/step));for(let i=0;i<k;i++)pts.push([x0+(x1-x0)*i/k,y0+(y1-y0)*i/k,nx,ny]);};
    const arc=(cx,cy,a0)=>{for(let i=0;i<5;i++){const a=a0+Math.PI/2*i/5;pts.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r,Math.cos(a),Math.sin(a)]);}};
    line(P+r,P,P+w-r,P,0,-1); arc(P+w-r,P+r,-Math.PI/2); line(P+w,P+r,P+w,P+h-r,1,0); arc(P+w-r,P+h-r,0);
    line(P+w-r,P+h,P+r,P+h,0,1); arc(P+r,P+h-r,Math.PI/2); line(P,P+h-r,P,P+r,-1,0); arc(P+r,P+r,Math.PI);
    return pts;
  },
  draw(now,force){
    const t=Perf.lite?0:(now-this.t0)/1000;
    for(const f of this.frames){
      if(!force&&!f.vis) continue;                          // рамки за экраном не трогаем
      if(!this.ro){ f.nw=f.el.offsetWidth; f.nh=f.el.offsetHeight; }
      const w=f.nw,h=f.nh; if(!w||!h) continue;
      const resized=w!==f.w||h!==f.h||!f.pts;
      if(resized){ f.w=w; f.h=h; f.pts=this.outline(w,h); }
      if(Perf.lite&&!resized&&!force) continue;             // в лёгком режиме контур рисуется один раз
      const n=f.pts.length, k1=6.2832*Math.max(2,Math.round(n/8))/n, k2=6.2832*Math.max(1,Math.round(n/22))/n;
      if(!f.qx||f.qx.length!==n){ f.qx=new Float32Array(n); f.qy=new Float32Array(n); }
      const qx=f.qx, qy=f.qy;
      for(let i=0;i<n;i++){ const p=f.pts[i], o=f.amp*(.55*Math.sin(i*k1+f.ph+t*1.25)+.9*Math.sin(i*k2-t*.8+f.ph*2)); qx[i]=p[0]+p[2]*o; qy[i]=p[1]+p[3]*o; }
      let d='M'+((qx[n-1]+qx[0])/2).toFixed(1)+' '+((qy[n-1]+qy[0])/2).toFixed(1);
      for(let i=0;i<n;i++){ const j=(i+1)%n; d+='Q'+qx[i].toFixed(1)+' '+qy[i].toFixed(1)+' '+((qx[i]+qx[j])/2).toFixed(1)+' '+((qy[i]+qy[j])/2).toFixed(1); }
      d+='Z';
      f.path.setAttribute('d',d);
      if(!Perf.lite) f.r2.setAttribute('stroke-dashoffset',(-t*95%4400).toFixed(0));   // блики бегут по кромке
    }
  },
};
/* ================== ПРОИЗВОДИТЕЛЬНОСТЬ ==================
   Auto: на слабых устройствах (мало памяти/ядер или кадры идут медленно) включается лёгкий режим. */
const Perf={
  lite:false, slow:0, cnt:0, bad:0, lastT:0, weak:false,
  guess(){ const m=navigator.deviceMemory, c=navigator.hardwareConcurrency;
    return (m&&m<=3)||(c&&c<=4)||(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches); },
  apply(){ this.lite = cfg.perf==='lite' || (cfg.perf==='auto'&&(this.weak||this.guess()));
    document.body.classList.toggle('lite',this.lite); },
  reset(){ this.cnt=0; this.slow=0; this.lastT=0; },
  tick(now){                                                // следим за плавностью и при необходимости упрощаем
    if(cfg.perf!=='auto'||this.lite||document.hidden) return;
    if(this.lastT){ const dt=now-this.lastT; if(dt<400){ this.cnt++; if(dt>30) this.slow++; } }
    this.lastT=now;
    if(this.cnt>=100){ this.bad = this.slow/this.cnt>.3 ? this.bad+1 : 0; this.cnt=0; this.slow=0;
      if(this.bad>=2){ this.weak=true; this.apply(); Liquid.attach(); } }
  },
};
(function loop(now){ if(Liquid.frames.length&&!document.hidden&&now-Liquid.last>=(Perf.lite?500:40)){ Liquid.last=now; Liquid.draw(now); }
  Perf.tick(now); requestAnimationFrame(loop); })(performance.now());

function render(){
  document.body.dataset.theme=cfg.theme; Perf.apply(); Perf.reset();
  document.documentElement.style.background=getComputedStyle(document.body).getPropertyValue('--bg');
  const app=$('#app');
  app.className='scr'+((screen==='play'||screen==='results')?' wide':'')+((screen==='play'&&isDraw())||(screen==='remote'&&R.isDrawView())?' dplay':'');
  app.innerHTML=({menu:vMenu,ready:vReady,countdown:vCountdown,play:vPlay,turnEnd:vTurnEnd,results:vResults,remote:vRemote})[screen]();
  Liquid.attach();
  if(screen==='play'&&isDraw()) Draw.mount();
  if(rcFitRO){ rcFitRO.disconnect(); rcFitRO=null; }
  if(screen==='remote'){ if(R.isDrawView()&&$('#rcv')){ RPad.mount(); R.fit(); if('ResizeObserver' in window){ rcFitRO=new ResizeObserver(()=>R.fit()); rcFitRO.observe($('.rpadwrap')); } } R.partial(); }
  RC.push(); RC.ui();
  document.querySelectorAll('[data-count]').forEach(el=>countUp(el,+el.dataset.count));
  if(screen==='results') confetti();
  if(document.activeElement&&document.activeElement.tagName==='BUTTON') document.activeElement.blur();
  window.scrollTo(0,0);
}
const sndBtns=()=>`<div class="snd"><button class="sm glass rcbtn ${RC.role==='screen'&&RC.remotes().length?'live':''}" onclick="rcOpen()" title="Fjernkontroll">${ICO.phone}</button><button class="sm glass ${cfg.music?'':'off'}" onclick="toggleSnd('music')" title="Musikk">🎵</button><button class="sm glass ${cfg.fx?'':'off'}" onclick="toggleSnd('fx')" title="Lyder">${cfg.fx?'🔊':'🔇'}</button></div>`;
const seg=(k,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button class="${cfg[k]===v?'on':''}" onclick="setCfg('${k}',${typeof v==='number'?v:`'${v}'`})">${l}</button>`).join('')}</div>`;

function vMenu(){

  <div class="card bare">
    <h2>Lagene</h2>
    <div class="row"><div class="tile a"><input type="text" class="nm a" maxlength="14" value="${esc(cfg.names[0])}" oninput="setName(0,this.value)" aria-label="Lag 1"></div>
      <span class="vs">VS</span><div class="tile b"><input type="text" class="nm b" maxlength="14" value="${esc(cfg.names[1])}" oninput="setName(1,this.value)" aria-label="Lag 2"></div></div>
  </div>
  <div class="card">
    <h2>Spillet</h2>
    <label class="l">Modus</label>${seg('mode',[['pic','Forklar bildet'],['draw','Tegn ordet']])}
    <label class="l">Tid per runde</label>${seg('secs',[[30,'30 s'],[45,'45 s'],[60,'1 min'],[90,'1,5 min'],[120,'2 min']])}
    <label class="l">Runder per lag</label>${seg('rounds',[[1,'1'],[2,'2'],[3,'3']])}
    <label class="l">Nivå</label>${seg('diff',[['easy','Lett'],['mix','Blandet'],['hard','Vanskelig']])}
    <label class="l">Tema <span style="font-weight:700">· ${n} ord</span></label>
    <select onchange="setCfg('topic',this.value)"><option value="all">🎲 Alle temaer</option>${Object.entries(TOPICS).map(([k,t])=>`<option value="${k}" ${k===cfg.topic?'selected':''}>${t.name}</option>`).join('')}</select>
    ${cfg.mode==='pic'?`<label class="chk"><input type="checkbox" ${cfg.showWord?'checked':''} onchange="setCfg('showWord',this.checked)"> Vis ordet under bildet</label>`:''}
  </div>
  <div class="card">
    <h2>Stil</h2>
    <div class="themes">${THEMES.map(t=>`<button class="${t.id===cfg.theme?'on':''}" onclick="setCfg('theme','${t.id}')" aria-label="${t.name}"><span class="pv" style="background:${t.bg};color:${t.ink}"><i style="background:${t.card}"></i><u>${t.dots.map(c=>`<b style="background:${c}"></b>`).join('')}</u>${t.name}</span></button>`).join('')}</div>
    <label class="l">Animasjoner</label>${seg('perf',[['auto','Auto'],['full','Full'],['lite','Lett']])}
    <label class="l">Musikk</label><select onchange="setCfg('pack',this.value)">${PACKS.map(([k,n])=>`<option value="${k}" ${k===cfg.pack?'selected':''}>${n}</option>`).join('')}</select>
  </div>
  <button class="go full big" onclick="newGame()">START SPILLET ▶</button>
  <div style="height:14px"></div>
  <div class="card">
    <h2>${ICO.phone} Fjernkontroll</h2>
    <p class="mute small" style="margin:-4px 0 12px">Spill på stor skjerm og styr fra telefonen: trykk RIKTIG der, eller tegn på telefonen mens skjermen viser tegningen.</p>
    <button class="full" onclick="rcOpen()">Koble en telefon til denne skjermen</button>
    <label class="l">Eller bruk denne enheten som fjernkontroll</label>
    <div class="row"><input type="text" id="rcin" class="grow" maxlength="4" placeholder="KODE" value="${esc(cfg.rjoin||'')}" style="text-transform:uppercase;letter-spacing:6px;text-align:center;font-size:20px" autocomplete="off" autocapitalize="characters"><button class="hi" onclick="rcJoin()">Bli fjernkontroll</button></div>
  </div>
  <div style="height:14px"></div>
  <details class="card dim rules"><summary>Slik spiller dere</summary><ol>
    ${cfg.mode==='draw'?`<li>Én fra laget tegner. Hen holder inne <b>øyet</b> for å se ordet – ingen andre skal se.</li>
    <li>Tegneren tegner ordet med fingeren – uten bokstaver, tall eller å snakke.</li>
    <li>Resten av laget gjetter høyt på norsk. Ved riktig svar trykker tegneren <b>RIKTIG</b>. Tiden står stille mens svaret vises.</li>`:`<li>Én fra laget skal gjette og sitter med ryggen mot skjermen.</li>
    <li>Resten av laget ser bildet og forklarer det på norsk – uten å si selve ordet.</li>
    <li>Når gjetteren svarer riktig, trykker spillelederen <b>RIKTIG</b>. Tiden står stille mens svaret vises.</li>`}
    <li>Hvert riktig svar gir 100 poeng + opptil 100 ekstra for fart.</li>
    <li>Lagene får ulike bilder, men med samme vanskelighetsgrad i samme rekkefølge.</li>
    <li>Laget med flest poeng vinner!</li></ol></details>
  ${cfg.history.length?`<div class="card dim hist"><b>Siste spill</b>${cfg.history.map(h=>`<div><span>${esc(h.n[0])} <b>${h.s[0]}</b></span><span><b>${h.s[1]}</b> ${esc(h.n[1])}</span></div>`).join('')}</div>`:''}`;
}
function scoreBar(act){
  return `<div class="score">${[0,1].map(i=>`<div class="s t${i} ${act===i?'act':''}"><small>${esc(cfg.names[i])}</small>${game.scores[i]}</div>`).join('')}</div>`;
}
function vReady(){
  const t=turn();
  return `<div class="top"><button class="sm glass" onclick="quit()">✕ Avslutt</button>${sndBtns()}</div>
  ${scoreBar(t.team)}
  <div class="card center">
    <div class="mute small">RUNDE ${t.round+1} AV ${cfg.rounds}</div>
    <div class="teamname t${t.team}">${esc(cfg.names[t.team])}</div>
    <h2 style="margin:6px 0 0;font-size:24px">Gjør dere klare!</h2>
    ${isDraw()?`<ol class="steps"><li>Velg én som skal tegne.</li><li>Tegneren holder inne øyet for å se ordet – de andre ser bort!</li><li>Tegn uten bokstaver og uten å snakke. Laget gjetter på norsk.</li></ol>`
    :`<ol class="steps"><li>Velg én som skal gjette.</li><li>Gjetteren sitter med ryggen mot skjermen.</li><li>Resten av laget forklarer bildet på norsk – uten å si ordet!</li></ol>`}
    <span class="pill">⏱ ${cfg.secs} sekunder</span>
  </div>
  <button class="go full big" onclick="startTurn()">VI ER KLARE! ▶</button>
  <p class="hint">Begge lag får ulike bilder med samme vanskelighetsgrad.</p>`;
}
function vCountdown(){
  const t=turn();
  return `<div class="cd"><div class="lbl">${esc(cfg.names[t.team])}</div><div class="ring"></div>
    <div class="n" style="animation-delay:0s">3</div><div class="n" style="animation-delay:.65s">2</div><div class="n" style="animation-delay:1.3s">1</div><div class="n kj" style="animation-delay:1.95s">KJØR!</div></div>`;
}
function vPlay(){
  const t=turn();
  return `<div class="top pl"><div class="who t${t.team}">${esc(cfg.names[t.team])} • RUNDE ${t.round+1}/${cfg.rounds}</div>
    <div class="row" style="gap:6px">${sndBtns()}<button class="sm glass" onclick="togglePause()" title="Pause"><span class="pi"></span></button><button class="sm glass" onclick="quit()" title="Avslutt">✕</button></div></div>
  <div class="hud"><div class="hudbox"><small>POENG</small><b id="sc">${t.score}</b></div><div class="hudbox"><small>RIKTIGE</small><b id="okc">0</b></div><div class="hudbox time" id="tbox"><small>TID</small><b id="tm">${cfg.secs}</b></div></div>
  ${isDraw()?`<div class="stage draw"><div class="dhead"><span class="rbadge">${ICO.phone} Tegner på telefonen</span><button class="peek new" id="peek" onpointerdown="peek(true,event)" onpointerup="peek(false)" onpointercancel="peek(false)" oncontextmenu="return false">${ICO.eye}<span class="lg">Hold for å se ordet</span><span class="sh">Se ordet</span></button><div class="row"><div class="lvl" id="lvl" title="Vanskelighetsgrad"></div><button class="tb" onclick="Draw.undo()" title="Angre">${ICO.undo}</button><button class="tb" onclick="Draw.wipe()" title="Tøm">${ICO.trash}</button></div></div>
    <div class="cvbox"><canvas id="cv"></canvas><div class="cvhint" id="cvhint">${ICO.pen}Tegn her</div><div class="peekov" id="peekov"></div></div>
    <div class="timer" id="tbar"><span class="tclip"><i id="bar"></i></span></div></div>
  <div class="tools" id="tools">${Draw.toolsHtml()}</div>`
  :`<div class="stage"><div class="lvl" id="lvl" title="Vanskelighetsgrad"></div><div class="picbox" id="pic"></div><div class="wordline" id="wl"></div><div class="timer" id="tbar"><span class="tclip"><i id="bar"></i></span></div></div>`}
  <div class="ctrl"><button class="skip" onclick="skip()">HOPP OVER →</button><button class="go" onclick="correct()">✓ RIKTIG!</button></div>
  <p class="hint keys">${isDraw()?'Hold øyet for å se ordet · Mellomrom = riktig · S = hopp over · Ctrl+Z = angre':'Mellomrom = riktig · S = hopp over · V = vis ordet · P = pause'}</p>
  <div class="pauseov" onclick="togglePause()"><div><div class="ic"><span class="pi"></span></div><b>PAUSE</b><span>Trykk for å fortsette</span></div></div>`;
}
function itemRow(it){
  const r=it.res==='ok'?`<span class="r ok">✓ +${it.pts}<br><span class="mute">${sec1(it.t)}</span></span>`:`<span class="r mute">${it.res==='skip'?'hoppet over':'ikke gjettet'}</span>`;
  return `<div class="it ${it.res==='ok'?'':'no'}">${em(it.w.e,'e')}<div class="grow"><b>${wordHtml(it.w)}</b></div>${it.d?`<img class="dth" src="${it.d}" alt="Tegning">`:''}${r}</div>`;
}
function teamStats(team){
  const items=game.turns.filter(t=>t.team===team).flatMap(t=>t.items), ok=items.filter(i=>i.res==='ok');
  return {items,ok:ok.length,skip:items.filter(i=>i.res==='skip').length,fast:ok.length?Math.min(...ok.map(i=>i.t)):null};
}
function vTurnEnd(){
  const t=turn(), ok=t.items.filter(i=>i.res==='ok'), last=game.ti>=game.turns.length-1, nx=last?null:game.turns[game.ti+1];
  return `<div class="top"><button class="sm glass" onclick="quit()">✕ Avslutt</button>${sndBtns()}</div>
  <div class="card center">
    <div class="mute small">RUNDE ${t.round+1} AV ${cfg.rounds} · FERDIG</div>
    <div class="teamname t${t.team}">${esc(cfg.names[t.team])}</div>
    <div class="bigscore" data-count="${t.score}">0</div><div class="mute">poeng</div>
    <div class="stats3"><div>${ok.length}<small>riktige</small></div><div>${t.items.filter(i=>i.res==='skip').length}<small>hoppet over</small></div><div>${ok.length?sec1(Math.min(...ok.map(i=>i.t))):'–'}<small>raskeste svar</small></div></div>
  </div>
  <button class="go full big" onclick="nextTurn()">${last?'SE RESULTATET 🏁':`NESTE: ${esc(cfg.names[nx.team])} →`}</button>
  <div style="height:14px"></div>
  <div class="card"><h2>Ordene</h2><div class="list">${t.items.map(itemRow).join('')}</div></div>`;
}
function vResults(){
  const [a,b]=game.scores, win=a===b?-1:(a>b?0:1), st=[teamStats(0),teamStats(1)];
  return `<div class="top"><span></span>${sndBtns()}</div>
  <div class="trophy">${em(win<0?'🤝':'🏆','ti')}</div>
  <div class="winner">${win<0?'Uavgjort!':`${esc(cfg.names[win])} vant!`}<small>${win<0?'Like mange poeng – ta en runde til!':`Gratulerer! ${Math.abs(a-b)} poeng foran.`}</small></div>
  <div class="final">${[0,1].map(i=>`<div class="f t${i} ${win===i?'win':''}">${win===i?em('👑','cr'):''}<div class="n">${esc(cfg.names[i])}</div><div class="p" data-count="${game.scores[i]}">0</div>
    <div class="d">${st[i].ok} riktige · ${st[i].skip} hoppet over${st[i].fast!==null?` · raskeste ${sec1(st[i].fast)}`:''}</div></div>`).join('')}</div>
  <div class="row" style="margin-bottom:14px"><button class="go full big" onclick="newGame()">🔁 SPILL IGJEN</button><button class="full big glass" onclick="toMenu()">Til menyen</button></div>
  <div class="cols">${[0,1].map(i=>`<div class="card"><h2><span class="dot t${i}"></span>${esc(cfg.names[i])}</h2><div class="list">${st[i].items.map(itemRow).join('')}</div></div>`).join('')}</div>`;
}

/* ================== ДЕЙСТВИЯ ================== */
function setName(i,v){ cfg.names[i]=v; save(); }
function setCfg(k,v){
  cfg[k]=v;
  if(k==='mode'&&v==='draw'&&cfg.secs<90){ cfg.secs=90; later(()=>toast('Tegning tar tid – runden er satt til 1,5 min'),50); }
  if(k==='theme'){ cfg.pack=THEMES.find(t=>t.id===v).pack; }
  save(); render();
  if(k==='theme'||k==='pack'){ Snd.stop(.1); if(cfg.music) Snd.play('menu'); }
  else Snd.sfx('click');
}
function toggleSnd(k){
  Snd.init();
  if(k==='music'){ cfg.music=!cfg.music; Snd.setMusic(cfg.music); if(cfg.music) autoMusic(); }
  else { cfg.fx=!cfg.fx; Snd.setFx(cfg.fx); }
  save();
  document.querySelectorAll('.snd').forEach(el=>el.outerHTML=sndBtns());
}
function autoMusic(){
  if(!cfg.music||Snd.loop) return;
  const k={menu:'menu',ready:'menu',turnEnd:'menu',results:'party',play:'round'}[screen];
  if(k&&!(screen==='play'&&(!play||play.over))){ Snd.play(k); if(screen==='play'&&play.paused) Snd.pause(); }
}
// браузер разрешает звук только после нажатия
document.addEventListener('click',()=>{ if(Snd.init()) autoMusic(); });
document.addEventListener('keydown',e=>{
  if(Snd.init()) autoMusic();
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')) return;
  const k=e.key;
  if(screen==='play'&&isDraw()&&(e.ctrlKey||e.metaKey)&&(k==='z'||k==='Z')){ e.preventDefault(); Draw.undo(); return; }
  if(screen==='play'){
    if(k===' '||k==='Enter'){ e.preventDefault(); if(!e.repeat){ play&&play.paused?togglePause():correct(); } }
    else if(k==='s'||k==='S'||k==='ArrowRight'){ e.preventDefault(); if(!e.repeat) skip(); }
    else if(k==='p'||k==='P'||k==='Escape'){ e.preventDefault(); if(!e.repeat) togglePause(); }
    else if(k==='v'||k==='V'){ toggleWord(); }
  } else if((k===' '||k==='Enter')&&!e.repeat){
    if(screen==='ready'){ e.preventDefault(); startTurn(); }
    else if(screen==='turnEnd'){ e.preventDefault(); nextTurn(); }
  }
});

/* таймер раунда: стоит во время анимации и паузы; музыка ускоряется к концу */
(function frame(now){
  if(screen==='remote') R.tick();
  if(screen==='play'&&play&&!play.over){
    const dt=Math.min(250,Math.max(0,now-play.last)); play.last=now;
    if(!play.anim&&!play.paused){ play.left-=dt; play.elapsed+=dt; }
    const left=Math.max(0,play.left), bar=$('#bar'), tm=$('#tm'), hurry=left<10000;
    const fr=(left/play.total).toFixed(3), sc=Math.ceil(left/1000);
    if(bar&&bar._v!==fr){ bar._v=fr; bar.style.transform=`translateX(-${((1-fr)*100).toFixed(1)}%)`; }
    if(tm&&tm._v!==sc){ tm._v=sc; tm.textContent=sc; }
    const tb=$('#tbar'), tx=$('#tbox'); if(tb) tb.classList.toggle('hurry',hurry); if(tx) tx.classList.toggle('hurry',hurry);
    const p=1-left/play.total;
    Snd.accel=.3*p*p+(hurry?.45*(1-left/10000):0);
    const sec=Math.ceil(left/1000);
    if(hurry&&sec!==play.lastSec&&sec>0&&!play.anim&&!play.paused){ play.lastSec=sec; Snd.sfx(sec<=3?'tock':'tick'); }
    if(play.left<=0) timeUp();
  }
  requestAnimationFrame(frame);
})(performance.now());

render();
if(cfg.rcOn&&cfg.rc) RC.join(cfg.rc,'screen');      // после перезагрузки экран снова ждёт свой пульт
</script>
</body>
